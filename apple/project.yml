# The only source of truth for the Xcode project. Edit this file, then run `just gen`.
name: Tuner
options:
  bundleIdPrefix: sk.riviatech
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    # The app name lives here only; rename the app by changing this line.
    APP_DISPLAY_NAME: Freetuner
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    APP_BUNDLE_ID: sk.riviatech.freetuner
    DEVELOPMENT_TEAM: 5RU7BRARKN
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
packages:
  TunerKit:
    path: TunerKit
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.7
targets:
  Tuner:
    type: application
    platform: iOS
    sources:
      - path: Tuner
    dependencies:
      - package: TunerKit
        product: TunerCore
      - package: TunerKit
        product: TunerUI
      - package: TunerKit
        product: TunerAudio
      - target: TunerAudioUnit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "The tuner listens to find the note you play. Nothing is recorded or sent."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  # Placeholder Audio Unit (pass-through effect): proves signing, embedding and registration.
  TunerAudioUnit:
    type: app-extension
    platform: iOS
    sources:
      - path: AudioUnit
    dependencies:
      - package: TunerKit
        product: TunerCore
    info:
      path: AudioUnit/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AudioUnitViewController
          NSExtensionAttributes:
            AudioComponents:
              - name: "RIVIAtech: Freetuner"
                description: Freetuner
                manufacturer: Rvtc
                type: aufx
                subtype: ftnr
                version: 1
                sandboxSafe: true
                tags: [Effects]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).audiounit
        TARGETED_DEVICE_FAMILY: "1,2"
  TunerSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SnapshotTests
        excludes:
          - "**/__Snapshots__/**"
    dependencies:
      - target: Tuner
      - package: TunerKit
        product: TunerUI
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).snapshots
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Tuner:
    build:
      targets:
        Tuner: all
        TunerSnapshotTests: [test]
    test:
      targets:
        - TunerSnapshotTests
      environmentVariables:
        # Failure diffs land here so an agent can open the PNGs.
        SNAPSHOT_ARTIFACTS: $(SRCROOT)/../artifacts/snapshots
