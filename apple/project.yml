name: Tuner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    # The app name lives here only; rename the app by changing this line.
    APP_DISPLAY_NAME: Tuner
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    # TunerCore wraps C++; every Swift module that imports it builds with C++ interop.
    SWIFT_OBJC_INTEROP_MODE: objcxx
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    DEVELOPMENT_TEAM: ""
packages:
  TunerCore:
    path: TunerCore
targets:
  Tuner:
    type: application
    platform: iOS
    sources:
      - path: Tuner
    dependencies:
      - package: TunerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tuner
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Tuner/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "The tuner listens to find the note you play. Nothing is recorded or sent."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  TunerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TunerTests
    dependencies:
      - target: Tuner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tuner.tests
schemes:
  Tuner:
    build:
      targets:
        Tuner: all
        TunerTests: [test]
    test:
      targets:
        - TunerTests
