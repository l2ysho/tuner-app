name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: core (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build just jq bc

      - uses: actions/cache@v4
        with:
          path: |
            build/dsp-asan
            apple/TunerKit/.build
          key: linux-${{ hashFiles('core/**/CMakeLists.txt', 'apple/TunerKit/Package.swift') }}
          restore-keys: linux-

      - run: just test-dsp
      - run: just test-core

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-logs
          path: build/logs

  apple:
    name: just check (macOS)
    # Same Xcode as the release uploads (`just upload` runs locally on Xcode 27.2).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Install tools
        run: brew install just xcodegen swiftlint xcbeautify llvm clang-format ninja

      - uses: actions/cache@v4
        with:
          path: |
            build/dsp-asan
            build/xcode/SourcePackages
            apple/TunerKit/.build
          key: macos-${{ hashFiles('core/**', 'apple/TunerKit/Package.swift', 'apple/project.yml') }}
          restore-keys: macos-

      - run: xcodebuild -version
      - run: just check

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-snapshot-diffs
          path: |
            build/logs
            artifacts
